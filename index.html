<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arcane Rift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 2:3 stage centered on a dark ground; the original art is the base layer,
   animated light, particle and portal layers sit on top, all positioned in stage fractions. */
:root {
  --ground: #060910;
  --ink: #e8f0ff;
  --rift: 110, 170, 255;
  --flame: 255, 170, 60;
  --flame-hot: 255, 230, 150;
  --font-ui: "Cinzel", "Trajan Pro", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: var(--font-ui);
}
.stage {
  position: relative;
  aspect-ratio: 2 / 3;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.stage:focus-visible { outline: 2px solid rgb(var(--rift)); outline-offset: 3px; }
.layer { position: absolute; pointer-events: none; }
.base { inset: 0; width: 100%; height: 100%; display: block; }

.vignette {
  inset: 0;
  background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0, 0, 10, .55) 100%);
  animation: vig 7s ease-in-out infinite;
}
@keyframes vig { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

.glow { mix-blend-mode: screen; border-radius: 50%; will-change: opacity, transform; }
.torch-glow {
  width: 34%; aspect-ratio: 1; top: 8%;
  background: radial-gradient(circle, rgba(var(--flame), .55), rgba(var(--flame), .18) 38%, transparent 68%);
}
.torch-glow.l { left: -17%; }
.torch-glow.r { right: -17%; }
.torch-core {
  width: 11%; aspect-ratio: 1; top: 20.2%;
  background: radial-gradient(circle, rgba(var(--flame-hot), .85), rgba(var(--flame), .35) 45%, transparent 72%);
}
.torch-core.l { left: -1.6%; }
.torch-core.r { right: -1.2%; }

.title-glow {
  left: 14%; top: 75.2%; width: 72%; height: 9%;
  background: radial-gradient(ellipse, rgba(70, 130, 255, .55), transparent 68%);
  filter: blur(10px);
  animation: titlepulse 4.2s ease-in-out infinite;
}
@keyframes titlepulse { 0%, 100% { opacity: .25; transform: scale(.96); } 50% { opacity: .85; transform: scale(1.03); } }
.tap-label {
  left: 0; right: 0; top: 94.3%;
  transform: translateY(-50%);
  text-align: center; white-space: nowrap;
  font-family: var(--font-ui); font-weight: 600; text-transform: uppercase;
  font-size: calc(var(--u, 10px) * 2.9);
  letter-spacing: .16em; padding-left: .16em;
  color: rgb(70, 220, 255);
  text-shadow: 0 0 .35em rgba(40, 150, 255, .95), 0 0 .9em rgba(30, 90, 255, .8), 0 0 1.6em rgba(20, 60, 200, .6);
}
.tap-label::before {
  content: ""; position: absolute; left: 28%; right: 28%; top: -.5em; bottom: -.5em; z-index: -1;
  background: radial-gradient(ellipse, rgba(10, 30, 160, .5), transparent 70%);
}

.fx { inset: 0; width: 100%; height: 100%; }
.ripple {
  position: absolute; width: 14%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid rgba(var(--rift), .9);
  box-shadow: 0 0 24px rgba(var(--rift), .8), inset 0 0 18px rgba(var(--rift), .5);
  transform: translate(-50%, -50%) scale(.1);
  pointer-events: none;
  animation: ripple 1.1s ease-out forwards;
}
@keyframes ripple { to { transform: translate(-50%, -50%) scale(3.4); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .vignette, .title-glow { animation: none; }
  .title-glow { opacity: .5; }
}
</style>

<div class="stage" id="stage" role="img" aria-label="Arcane Rift: a vine-covered stone archway with two lit torches opens onto a sunny meadow. The rift flickers and closes.">
  <img class="layer base" id="base" src="assets/rift/Closed_Rift.jpg" alt="" draggable="false">

  <div class="layer glow torch-glow l" id="tgL"></div>
  <div class="layer glow torch-glow r" id="tgR"></div>
  <div class="layer glow torch-core l" id="tcL"></div>
  <div class="layer glow torch-core r" id="tcR"></div>

  <div class="layer glow title-glow"></div>
  <div class="layer tap-label">Tap to Leave</div>

  <canvas class="layer fx" id="fx"></canvas>
  <div class="layer vignette"></div>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stage = document.getElementById("stage");
  var fx = document.getElementById("fx");
  var els = {
    tgL: document.getElementById("tgL"), tgR: document.getElementById("tgR"),
    tcL: document.getElementById("tcL"), tcR: document.getElementById("tcR")
  };
  var lights = [{ g: els.tgL, c: els.tcL }, { g: els.tgR, c: els.tcR }];
  var fctx = fx.getContext("2d");
  var W = 0, H = 0, dpr = 1;

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    fx.width = W * dpr; fx.height = H * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stage.style.setProperty("--u", (W / 100) + "px");
  }
  fit();
  window.addEventListener("resize", fit);

  var rnd = Math.random;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* Smooth 1D value noise (0..1): drives flame sway, height and brightness */
  var NT = [];
  for (var n = 0; n < 512; n++) NT.push(rnd());
  function noise(x) {
    var i = Math.floor(x), f = x - i, a = NT[i & 511], b = NT[(i + 1) & 511];
    var s = f * f * (3 - 2 * f);
    return a + (b - a) * s;
  }

  /* Torch anchors (fractions of the stage); y is the base of the painted flame */
  var torches = [
    { x: 0.040, y: 0.268, seed: 11.3, f: .8, lean: 0, gust: 0, gdir: 1, next: 1 },
    { x: 0.968, y: 0.268, seed: 47.9, f: .8, lean: 0, gust: 0, gdir: -1, next: 2 }
  ];

  var embers = [], smoke = [], motes = [];
  var wind = 0;

  function spawnEmber(t, burst) {
    embers.push({
      x: t.x + (rnd() - .5) * 0.02, y: t.y - 0.02 * rnd(),
      vx: (rnd() - .5) * (burst ? 0.30 : 0.05), vy: -(0.05 + rnd() * (burst ? 0.30 : 0.14)),
      ph: rnd() * 6.28, life: 0, max: (burst ? 1.2 : 2) + rnd() * 2.2, r: 0.7 + rnd() * 1.8
    });
  }
  function spawnSmoke(tc) {
    smoke.push({
      x: tc.x + (rnd() - .5) * 0.015, y: tc.y - 0.08,
      vx: (rnd() - .5) * 0.01, vy: -(0.035 + rnd() * 0.03),
      life: 0, max: 2.2 + rnd() * 1.6, r: 0.012 + rnd() * 0.01
    });
  }
  for (var i = 0; i < 46; i++) {
    motes.push({
      x: 0.22 + rnd() * 0.56, y: 0.24 + rnd() * 0.50,
      vx: (rnd() - .5) * 0.012, vy: -0.004 - rnd() * 0.012,
      ph: rnd() * 6.28, sp: 0.6 + rnd() * 1.6, r: 0.6 + rnd() * 1.5
    });
  }

  /* Per-torch state: brightness f (0..1), lean (sideways bend), random gusts */
  function updateTorch(tc, t, dt) {
    if (t > tc.next) {
      tc.gust = .5 + rnd() * .5;
      tc.gdir = rnd() < .5 ? -1 : 1;
      tc.next = t + 1.5 + rnd() * 3.5;
      if (tc.gust > .7) for (var b = 0; b < 3; b++) spawnEmber({ x: tc.x, y: tc.y - 0.05 }, true);
    }
    tc.gust *= Math.exp(-dt * 3);
    var s = tc.seed;
    var fl = noise(t * 2.1 + s) * .45 + noise(t * 5.3 + s * 1.7) * .35 + noise(t * 12 + s * 2.9) * .2;
    tc.f = clamp(.78 + (fl - .5) * 1.1 - tc.gust * .28, .3, 1);
    tc.lean = (noise(t * .8 + s * 3) - .5) * .5 + wind + tc.gdir * tc.gust * .45;
  }

  /* Flame body: several tapered tongues that sway, stretch and lag at the tip */
  function drawFlame(tc, t) {
    var bx = tc.x * W, by = tc.y * H;
    var fw = W * 0.034;
    var fh = H * 0.088 * (.8 + tc.f * .35);
    var tongues = 6, s = tc.seed;
    var a = .30 * (.55 + .45 * tc.f);
    for (var j = 0; j < tongues; j++) {
      var ph = s + j * 1.7;
      var spread = j / (tongues - 1) - .5;
      var hj = fh * (1 - Math.abs(spread) * .9) * (.75 + noise(t * 6.5 + ph * 1.3) * .5);
      var w = fw * (1 - Math.abs(spread) * .9) * (.75 + noise(t * 4 + ph * .7) * .5);
      var ox = spread * fw * 1.3;
      var sway = (noise(t * 3.2 + ph) - .5) * fw * 1.6 + tc.lean * hj * .55;
      var tipx = bx + ox * .6 + sway, tipy = by - hj;
      var midx = bx + ox + sway * .25 + (noise(t * 4.4 + ph * 2) - .5) * fw * .8, midy = by - hj * .5;
      fctx.beginPath();
      fctx.moveTo(bx + ox - w, by);
      fctx.quadraticCurveTo(midx - w * 1.05, midy, tipx, tipy);
      fctx.quadraticCurveTo(midx + w * 1.05, midy, bx + ox + w, by);
      fctx.closePath();
      var g = fctx.createLinearGradient(bx + ox, by, tipx, tipy);
      g.addColorStop(0, "rgba(255,235,170," + (a * .9) + ")");
      g.addColorStop(.35, "rgba(255,170,50," + (a * .7) + ")");
      g.addColorStop(.8, "rgba(255,90,10," + (a * .35) + ")");
      g.addColorStop(1, "rgba(200,40,0,0)");
      fctx.fillStyle = g;
      fctx.fill();
    }
    /* hot core at the base */
    var cx = bx + tc.lean * fw * .4, cy = by - fh * .2, cr = fw * .8;
    var cg = fctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
    var ca = .5 * tc.f;
    cg.addColorStop(0, "rgba(255,250,215," + ca + ")");
    cg.addColorStop(.5, "rgba(255,200,90," + (ca * .5) + ")");
    cg.addColorStop(1, "rgba(255,140,30,0)");
    fctx.fillStyle = cg;
    fctx.beginPath(); fctx.arc(cx, cy, cr, 0, 6.283); fctx.fill();
  }

  var last = 0, emberAcc = [0, 0], smokeAcc = [0, 0];

  function frame(ts) {
    var t = ts / 1000;
    var dt = last ? Math.min(0.05, t - last) : 0.016;
    last = t;

    wind = (noise(t * .35 + 100) - .5) * .8;
    for (var k = 0; k < 2; k++) updateTorch(torches[k], t, dt);

    /* torch light on the stone: brightness, size and a slight lean */
    for (var L = 0; L < 2; L++) {
      var tc = torches[L], f = tc.f;
      lights[L].g.style.opacity = (.35 + f * .65).toFixed(3);
      lights[L].g.style.transform = "scale(" + (.94 + f * .1).toFixed(3) + ")";
      lights[L].c.style.opacity = (.45 + f * .55).toFixed(3);
      lights[L].c.style.transform = "translate(" + (tc.lean * 14).toFixed(2) + "%," +
        (-(f - .7) * 8).toFixed(2) + "%) scale(" + (.88 + f * .28).toFixed(3) + ")";
    }

    fctx.clearRect(0, 0, W, H);

    /* faint smoke (normal blending) */
    fctx.globalCompositeOperation = "source-over";
    for (var k2 = 0; k2 < 2; k2++) {
      smokeAcc[k2] += dt * 3;
      while (smokeAcc[k2] >= 1) { spawnSmoke(torches[k2]); smokeAcc[k2] -= 1; }
    }
    for (var s = smoke.length - 1; s >= 0; s--) {
      var sp = smoke[s]; sp.life += dt;
      if (sp.life >= sp.max) { smoke.splice(s, 1); continue; }
      sp.x += (sp.vx + wind * .04) * dt; sp.y += sp.vy * dt;
      var su = sp.life / sp.max;
      var sr = sp.r * W * (1 + su * 2.2);
      var sa = Math.sin(su * Math.PI) * .07;
      var sx = sp.x * W, sy = sp.y * H;
      var sg = fctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, "rgba(70,60,60," + sa + ")");
      sg.addColorStop(1, "rgba(70,60,60,0)");
      fctx.fillStyle = sg;
      fctx.beginPath(); fctx.arc(sx, sy, sr, 0, 6.283); fctx.fill();
    }

    /* additive layers: flames, embers, motes */
    fctx.globalCompositeOperation = "lighter";
    for (var k3 = 0; k3 < 2; k3++) {
      emberAcc[k3] += dt * 2.2;
      while (emberAcc[k3] >= 1) {
        spawnEmber({ x: torches[k3].x, y: torches[k3].y - 0.04 - rnd() * 0.04 }, false);
        emberAcc[k3] -= 1;
      }
      drawFlame(torches[k3], t);
    }

    for (var e = embers.length - 1; e >= 0; e--) {
      var m = embers[e]; m.life += dt;
      if (m.life >= m.max) { embers.splice(e, 1); continue; }
      m.x += (m.vx + Math.sin(t * 2 + m.ph) * 0.02 + wind * .05) * dt; m.y += m.vy * dt;
      var uu = m.life / m.max;
      var al = Math.sin(Math.min(1, uu * 1.2) * Math.PI) * .95 * (.7 + Math.sin(t * 22 + m.ph) * .3);
      var ex = m.x * W, ey = m.y * H;
      var gg = fctx.createRadialGradient(ex, ey, 0, ex, ey, m.r * 3.2);
      gg.addColorStop(0, "rgba(255,210,120," + al + ")");
      gg.addColorStop(.4, "rgba(255,130,30," + al * .5 + ")");
      gg.addColorStop(1, "rgba(255,80,0,0)");
      fctx.fillStyle = gg;
      fctx.beginPath(); fctx.arc(ex, ey, m.r * 3.2, 0, 6.283); fctx.fill();
    }

    for (var q = 0; q < motes.length; q++) {
      var o = motes[q];
      o.x += (o.vx + Math.sin(t * .6 + o.ph) * 0.006) * dt;
      o.y += o.vy * dt;
      if (o.y < 0.22) { o.y = 0.74; o.x = 0.22 + rnd() * 0.56; }
      if (o.x < 0.22) o.x = 0.78; if (o.x > 0.78) o.x = 0.22;
      var tw = .35 + .65 * (Math.sin(t * o.sp + o.ph) * .5 + .5);
      var mx = o.x * W, my = o.y * H;
      var mg = fctx.createRadialGradient(mx, my, 0, mx, my, o.r * 4);
      mg.addColorStop(0, "rgba(255,248,200," + (tw * .8) + ")");
      mg.addColorStop(1, "rgba(255,240,170,0)");
      fctx.fillStyle = mg;
      fctx.beginPath(); fctx.arc(mx, my, o.r * 4, 0, 6.283); fctx.fill();
    }
    fctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }

  stage.addEventListener("pointerdown", function (ev) {
    if (reduce) return;
    var r = stage.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
    var rp = document.createElement("div");
    rp.className = "ripple";
    rp.style.left = (px * 100) + "%"; rp.style.top = (py * 100) + "%";
    stage.appendChild(rp);
    setTimeout(function () { rp.remove(); }, 1200);
    for (var i = 0; i < 18; i++) spawnEmber({ x: px, y: py }, true);
  });
  stage.tabIndex = 0;

  if (reduce) {
    ["tgL", "tgR", "tcL", "tcR"].forEach(function (k) { els[k].style.opacity = .7; });
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>

</body></html>
