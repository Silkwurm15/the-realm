<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE REALM — 3D Map Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<style>
:root{--gold:#d9b76e;--gold-hi:#fff0b5;--gold-dim:#77552b;--parchment:#ead8ac}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14261d;color:#f4e7c6;font-family:Georgia,'Palatino Linotype',serif}button{font:inherit}
#map{position:absolute;inset:0;z-index:1;background:#14261d}
.maplibregl-ctrl-attrib{font:10px Arial,sans-serif!important;background:#080a08c9!important;color:#d7c69e!important;margin-bottom:76px!important}.maplibregl-ctrl-attrib a{color:#f0d58e!important}
.maplibregl-ctrl-bottom-right{z-index:5}
/* Atmosphere: haze at the horizon, vignette, and arcane tint over the real map */
.map-arcane-wash{position:absolute;inset:0;z-index:350;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 38%,rgba(7,12,8,.14) 70%,rgba(5,8,6,.55) 100%),linear-gradient(135deg,rgba(96,71,30,.08),transparent 32%,rgba(24,75,76,.08) 70%,rgba(0,0,0,.1));mix-blend-mode:multiply}
.haze{position:absolute;left:0;right:0;top:0;height:34%;z-index:360;pointer-events:none;background:linear-gradient(180deg,#0b1812 0%,#142a22e6 22%,#2a4a4a55 60%,transparent 100%)}
.shade{position:absolute;inset:0;z-index:400;pointer-events:none;background:linear-gradient(180deg,#070805a0 0%,#07080520 13%,transparent 28%,transparent 70%,#08080550 85%,#080805b8 100%)}
.hud{position:absolute;z-index:500}.hud.panel{position:absolute}.panel{position:relative;background:linear-gradient(135deg,rgba(45,34,22,.97),rgba(12,12,10,.97) 70%);border:1px solid var(--gold-dim);box-shadow:0 5px 18px #000b,inset 0 1px 0 #fff2c02c,inset 0 -2px 0 #0009;border-radius:5px}.panel:before{content:"";position:absolute;inset:4px;border:1px solid #d6b56b66;pointer-events:none;border-radius:3px}.panel:after{content:"✦";position:absolute;right:6px;top:2px;font-size:9px;color:#f2d895a8;pointer-events:none}
.topbar{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;align-items:stretch}.profile{display:flex;align-items:center;gap:9px;padding:9px 11px;min-width:0;flex:1}
.portrait{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:50%;border:2px solid #e4c578;outline:1px solid #6e4d24;outline-offset:2px;background:radial-gradient(ellipse at 50% 75%,#6e5734 0,#201a13 58%,#080807 80%);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 3px #17120d,0 0 14px #e1b95b30}.portrait svg{width:48px;height:48px;filter:drop-shadow(0 2px 3px #000)}
.profile-info{min-width:0;flex:1}.eyebrow{color:#e6c77e;text-transform:uppercase;letter-spacing:1.7px;font:700 8px Arial,sans-serif}.player-name{font-size:18px;font-weight:bold;line-height:1.1;color:#fff0c6;text-shadow:0 2px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.xptext{font:10px Arial,sans-serif;color:#d7c59f}.xpbar{height:8px;background:#080806;border:1px solid #94713a;box-shadow:inset 0 1px 3px #000;border-radius:1px;overflow:hidden;margin-top:4px}.xpfill{height:100%;width:26%;background:linear-gradient(90deg,#17677e,#4bc1d7,#c1f8f3);box-shadow:0 0 7px #4ac7df}
.level{border:1px solid #e5c77b;background:radial-gradient(circle,#3a2b18,#0d0b08 72%);box-shadow:inset 0 0 0 2px #382817,0 0 0 1px #000;border-radius:50%;width:37px;height:37px;flex:0 0 37px;display:grid;place-items:center;font-size:17px;color:#ffebad;font-weight:bold}
.iconbtn{width:43px;flex:0 0 43px;display:grid;place-items:center;color:var(--gold-hi);font-size:23px;cursor:pointer;border-radius:5px}.gps-pill{display:flex;align-items:center;gap:6px;padding:7px 8px;min-height:43px;font:9px Arial,sans-serif;white-space:nowrap}.gps-dot{width:7px;height:7px;border-radius:50%;background:#d9ad4e;box-shadow:0 0 9px currentColor}
.quest-card{top:91px;left:9px;width:min(292px,75vw);padding:11px 12px 12px;background:linear-gradient(125deg,#302516f5,#110e0bf7);border-color:#b18a47;box-shadow:0 5px 16px #000a,inset 0 0 0 2px #4b371d,inset 0 0 0 3px #c6a35b3b;cursor:pointer}.quest-card:before{inset:5px;border:1px solid #d6b56b75}.quest-card:after{content:"›";top:auto;right:12px;bottom:auto;top:50%;transform:translateY(-50%);font:700 22px Arial,sans-serif;color:#e8d7a4}
.card-row{display:flex;align-items:center;gap:10px}.card-icon{width:42px;height:46px;flex:0 0 42px;display:grid;place-items:center;background:linear-gradient(145deg,#5b4425,#1b140d);border:1px solid #d0a75a;box-shadow:inset 0 0 0 2px #1d160e,0 0 0 1px #000;color:#f6d98b;border-radius:3px}.card-icon svg{width:27px;height:30px}
.card-title{color:#d9b56c;text-transform:uppercase;font:700 8px Arial,sans-serif;letter-spacing:1.6px;margin-bottom:4px}.card-copy{font-size:14px;line-height:1.22;color:#fff0c8;text-shadow:0 1px 2px #000;padding-right:14px}.card-sub{font:10px Arial,sans-serif;color:#b7a47c;margin-top:3px}
.compass{top:96px;right:9px;width:55px;height:55px;border:1px solid #c7a45e;border-radius:50%;background:radial-gradient(circle,#352818,#0b0b09 70%);display:grid;place-items:center;box-shadow:0 4px 12px #000b,inset 0 0 0 3px #17120d,inset 0 0 0 4px #b08a4a66;cursor:pointer}.compass:before{content:'N';position:absolute;top:3px;left:50%;transform:translateX(-50%);font:700 9px Arial,sans-serif;color:#f5dfa0;z-index:2}
.needle{width:26px;height:26px;transition:transform .15s linear;margin-top:6px}
.side-controls{position:absolute;z-index:500;right:10px;top:164px;display:flex;flex-direction:column;gap:7px}.round-control{position:relative;width:43px;height:43px;border-radius:5px;background:linear-gradient(145deg,#34291b,#0b0b09);border:1px solid #a98649;box-shadow:0 3px 9px #000b,inset 0 0 0 2px #17120d,inset 0 0 0 3px #b28b482e;display:grid;place-items:center;font:22px Arial,sans-serif;color:#f1d895;cursor:pointer}.round-control:before{content:"";position:absolute;inset:3px;border:1px solid #c6a15a36;border-radius:2px;pointer-events:none}.round-control:active,.nav-item:active,.iconbtn:active{transform:scale(.96)}
.bottom-left{left:9px;bottom:calc(79px + env(safe-area-inset-bottom));padding:9px 12px;display:flex;gap:9px;align-items:center;max-width:235px;background:linear-gradient(120deg,#332719f5,#0d0c0af5);border-color:#b08a49;cursor:pointer}.bottom-left .chest{width:35px;height:35px;display:grid;place-items:center;border:1px solid #a17c3d;background:linear-gradient(135deg,#5d421e,#1a1209);font-size:23px;box-shadow:inset 0 0 0 2px #20170d}.bottom-left strong{display:block;font-size:13px;color:#f2d795}.bottom-left small{display:block;color:#c8b894;font:9px Arial,sans-serif;margin-top:3px}
.bottom-nav{position:absolute;z-index:510;bottom:0;left:0;right:0;min-height:72px;padding:7px 4px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);background:linear-gradient(180deg,#30251af7,#0a0908 78%);border-top:2px solid #b08a48;box-shadow:0 -5px 22px #000b,inset 0 1px 0 #f3d58c44}.nav-item{position:relative;color:#b8a77f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;cursor:pointer;border-right:1px solid #b38c4b20}.nav-item:last-child{border:0}.nav-icon{height:25px;display:grid;place-items:center;font-size:21px;line-height:1;color:inherit;position:relative}.nav-label{font:9px Arial,sans-serif;letter-spacing:.25px;white-space:nowrap}.nav-item.active{color:#ffe4a0;text-shadow:0 0 8px #d6ad5d66;background:linear-gradient(180deg,#b68a3b1c,transparent)}.nav-item.active:before{content:"";position:absolute;top:-7px;width:28px;height:2px;background:#e7c675;box-shadow:0 0 8px #f5d78d}.nav-dot{position:absolute;top:-2px;right:-7px;width:9px;height:9px;border-radius:50%;background:#e5483d;border:1px solid #2a0d0b}
.toolfar{position:absolute;z-index:850;left:50%;top:42%;transform:translate(-50%,-50%);padding:14px 26px;border:1px solid var(--gold);border-radius:4px;background:linear-gradient(135deg,#342718,#0e0c09);box-shadow:0 10px 35px #000d,inset 0 0 0 3px #1b140b;color:#fff0c6;font:700 16px Georgia,serif;letter-spacing:.5px;text-align:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}.toolfar.show{opacity:1;visibility:visible;transition:opacity .15s ease}.toolfar small{display:block;margin-top:3px;font:11px Arial,sans-serif;font-weight:400;color:#c8b894;letter-spacing:0}
.toast{position:absolute;z-index:800;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#342718,#0e0c09);border:1px solid var(--gold);border-radius:4px;padding:16px 20px;max-width:82vw;text-align:center;box-shadow:0 10px 35px #000d,inset 0 0 0 3px #1b140b;display:none;font-size:14px;line-height:1.4}.toast.show{display:block;animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.menu{position:absolute;z-index:700;right:9px;top:60px;width:200px;padding:9px;display:none}.menu.open{display:block}.menu button{display:block;width:100%;padding:12px 10px;text-align:left;background:transparent;color:var(--parchment);border:0;border-bottom:1px solid #a8874a35;font:14px Georgia,serif}.menu button:last-child{border:0}

/* ===== World markers (HTML, billboarded above the tilted ground) ===== */
.mk{--c:#f4d17e;--bg:#3a2506;width:56px;height:92px;position:absolute;top:0;left:0;cursor:pointer}
.mk .beam{position:absolute;left:50%;bottom:8px;width:4px;height:74px;transform:translateX(-50%);background:linear-gradient(to top,var(--c),transparent);opacity:.5;filter:blur(1.5px)}
.mk .float{position:absolute;inset:0;animation:bob 2.6s ease-in-out infinite}
.mk .badge{position:absolute;left:9px;top:4px;width:38px;height:38px;transform:rotate(45deg);border:2px solid var(--c);border-radius:9px;background:radial-gradient(circle at 35% 30%,var(--bg),#0b0a08 95%);box-shadow:0 0 14px var(--c),0 0 0 3px #0a0907aa,inset 0 0 0 2px #00000066;display:grid;place-items:center}
.mk .badge i{transform:rotate(-45deg);display:grid;place-items:center;color:var(--c);filter:drop-shadow(0 1px 2px #000)}.mk .badge svg{width:21px;height:21px}
.mk .tip{position:absolute;left:50%;top:40px;width:0;height:0;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:12px solid var(--c);filter:drop-shadow(0 0 5px var(--c))}
.mk .ground{position:absolute;left:1px;bottom:-9px;width:54px;height:22px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 14px var(--c),inset 0 0 10px var(--c);opacity:.8;animation:ring 2.4s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.15);opacity:.15}}
.mk.quest{--c:#62c8ff;--bg:#0f2f4d}.mk.chest{--c:#ffc24a;--bg:#3a2506}.mk.nature{--c:#7be37a;--bg:#12301a}.mk.boss{--c:#ff5a4d;--bg:#3a0f0d}.mk.rift{--c:#b184ff;--bg:#24123f}
.mk.boss .badge{width:42px;height:42px;left:7px;box-shadow:0 0 22px var(--c),0 0 0 3px #0a0907aa}
.mk{transition:opacity .3s,filter .3s}.mk.far{opacity:.5;filter:grayscale(.65)}
/* Player */
.pl{width:80px;height:92px;position:absolute;top:0;left:0;pointer-events:none}.pl .disc{position:absolute;left:5px;bottom:-6px;width:70px;height:30px;border-radius:50%;border:2px solid #66e1f2;background:radial-gradient(ellipse,#55c9ff66,#55c9ff10 70%);box-shadow:0 0 18px #48bfffaa,inset 0 0 12px #48bfff88}.pl .col{position:absolute;left:50%;bottom:8px;width:5px;height:84px;transform:translateX(-50%);background:linear-gradient(to top,#6fdcff,transparent);opacity:.55;filter:blur(1.5px)}.pl svg{position:absolute;left:22px;bottom:6px;width:36px;height:62px;filter:drop-shadow(0 3px 4px #000)}

/* ===== Compact HUD (v3) ===== */
.topbar{align-items:flex-start;gap:6px;top:max(6px,env(safe-area-inset-top))}
.profile{padding:6px 9px;gap:8px;flex:1}
.portrait{width:42px;height:42px;flex:0 0 42px}.portrait svg{width:39px;height:39px}
.eyebrow{display:none}.player-name{font-size:15px;margin:0 0 2px}.xptext{font-size:9px}.xpbar{height:6px;margin-top:3px}
.level{width:30px;height:30px;flex:0 0 30px;font-size:14px}
.gps-pill{min-height:0;height:34px;padding:0 9px;font-size:9px}
.iconbtn{width:36px;height:34px;flex:0 0 36px;font-size:19px}
.quest-card{top:calc(max(6px,env(safe-area-inset-top)) + 60px);left:8px;width:min(246px,66vw);padding:7px 9px}.quest-card:before{inset:3px}.quest-card:after{font-size:18px;right:8px}
.card-row{gap:8px}.card-icon{width:32px;height:36px;flex:0 0 32px}.card-icon svg{width:21px;height:24px}
.card-title{font-size:7px;margin-bottom:2px}.card-copy{font-size:12.5px;line-height:1.18;padding-right:12px}.card-sub{font-size:9px;margin-top:2px}
.compass{top:calc(max(6px,env(safe-area-inset-top)) + 60px);right:8px;width:44px;height:44px}.needle{width:20px;height:20px;margin-top:5px}.compass:before{font-size:8px}
.side-controls{top:calc(max(6px,env(safe-area-inset-top)) + 112px);right:8px;gap:6px}.round-control{width:38px;height:38px;font-size:19px}
.bottom-left{left:8px;padding:6px 9px;max-width:200px}.bottom-left .chest{width:28px;height:28px;font-size:18px}.bottom-left strong{font-size:12px}.bottom-left small{font-size:8px;margin-top:2px}
/* Follow-mode button: glows gold when the camera is NOT locked to you */
/* Modal (GPS permission / errors) */
.modal{position:absolute;inset:0;z-index:900;background:rgba(5,8,6,.74);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
.modal-card{max-width:340px;width:100%;padding:22px 20px;text-align:center}.modal-card h2{font:700 20px Georgia,serif;color:#fff0c6;margin:6px 0 8px}.modal-card p{font:14px/1.45 Arial,sans-serif;color:#d7c59f;margin:0 0 14px}.m-icon{font-size:34px}
.m-btn{display:block;width:100%;padding:13px;margin-top:8px;border-radius:5px;border:1px solid #e5c77b;background:linear-gradient(180deg,#6a4f22,#2c200f);color:#fff0c6;font:700 15px Georgia,serif;cursor:pointer}.m-btn.ghost{background:transparent;border-color:#77552b;color:#b9a67d;font-weight:400;font-size:13px}
@media(min-width:700px){.topbar{left:18px;right:18px;top:18px}.profile{max-width:380px}.quest-card{left:18px;top:84px}.compass{right:18px;top:84px}.side-controls{right:18px;top:140px}.bottom-left{left:18px;bottom:92px}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(700px,90vw);border:2px solid #8b6937;border-bottom:0;border-radius:7px 7px 0 0}}
@media(max-width:390px){.gps-pill{padding:0 6px;font-size:8px}.topbar{gap:5px}.player-name{font-size:14px}.nav-icon{font-size:19px}.nav-label{font-size:8px}.bottom-left{max-width:190px}}

.qpanel{position:absolute;z-index:505;left:0;right:0;top:calc(max(6px,env(safe-area-inset-top)) + 58px);bottom:calc(72px + env(safe-area-inset-bottom));display:none;overflow-y:auto;padding:10px 10px 18px;background:linear-gradient(180deg,#120f0bf2,#0b0a08f7);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.qpanel.open{display:block}
.qtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qtab{padding:14px 4px;text-align:center;font:700 15px Georgia,serif;color:#cdb98a;background:linear-gradient(145deg,#34291b,#0b0b09);border:1px solid #77552b;border-radius:5px;cursor:pointer}.qtab.on{color:#fff0c6;border-color:#e5c77b;background:linear-gradient(180deg,#6a4f22,#2c200f);box-shadow:0 0 12px #d6ad5d44}
.qcard{margin-top:8px;padding:10px 12px;border:1px solid #77552b;border-radius:5px;background:linear-gradient(135deg,#2d2216f2,#0e0c09f2);color:#ead8ac}.qcard.ms{border-color:#e5c77b;box-shadow:inset 0 0 0 2px #4b371d}.qcard.done{opacity:.55}
.qt{display:flex;justify-content:space-between;gap:8px;font-size:14px}.qt span{color:#f2d795;font:700 11px Arial,sans-serif;white-space:nowrap;padding-top:2px}.qbar{height:5px;margin:8px 0 5px;background:#000a;border-radius:3px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#b9893a,#f2d795)}.qs{font:10px Arial,sans-serif;color:#c8b894;margin-top:5px}.qbar+.qs{margin-top:0}
.qbtn{margin-top:8px;width:100%;padding:10px;border-radius:5px;border:1px solid #e5c77b;background:linear-gradient(180deg,#6a4f22,#2c200f);color:#fff0c6;font:700 13px Georgia,serif;cursor:pointer}
.qh{margin:26px 2px 0;display:flex;justify-content:space-between;color:#f2d795;font:700 13px Georgia,serif;letter-spacing:.8px;text-transform:uppercase}.qsp{height:14px}.qaw{margin-top:10px;text-align:center;color:#f2d795;font:700 15px Georgia,serif;padding:14px;border:1px dashed #77552b;border-radius:5px}
.qcard:not([data-act=""]){cursor:pointer}.qcard.rdy{border-color:#7be37a;box-shadow:0 0 12px #7be37a55}.qcard:active{transform:scale(.99)}#mText{white-space:pre-line}
@media(min-width:700px){.qpanel{top:84px;left:50%;right:auto;width:min(700px,90vw);transform:translateX(-50%)}}
</style></head><body>
<div id="auth"><div class="ab"><div class="at">THE REALM</div><div class="as">Sign in to begin your adventure</div>
<button id="aGoogle" class="ag">Continue with Google</button><div class="ad"><span>or</span></div>
<input id="aEmail" type="email" placeholder="Email" autocomplete="email"><input id="aPass" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<div class="ar"><button id="aIn">Sign in</button><button id="aUp" class="alt">Create account</button></div>
<div id="aForgot" class="al">Forgot password?</div><div id="aMsg" class="am"></div></div></div>
<style>#auth{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#2a2214,#080a08 70%);color:#ead8ac;font-family:Georgia,serif}#auth .ab{width:100%;max-width:360px;padding:26px 22px;border:1px solid #b99a52;border-radius:6px;background:linear-gradient(135deg,#251d12,#0e0c09);box-shadow:0 14px 50px #000c,inset 0 0 0 3px #1b140b}#auth .at{text-align:center;font-size:28px;font-weight:700;letter-spacing:5px;color:#f0d58e}#auth .as{text-align:center;margin:6px 0 20px;font-size:13px;color:#c8b894}#auth button,#auth input{width:100%;box-sizing:border-box;padding:13px;margin:0 0 10px;border-radius:4px;font:16px Georgia,serif}#auth input{border:1px solid #6b5a33;background:#0b0a08;color:#ffeccb}#auth button{border:1px solid #d6b866;background:linear-gradient(#5a4725,#33280f);color:#fff0c6;font-weight:700;cursor:pointer}#auth button.alt{background:#15110a}#auth button:disabled{opacity:.5}#auth .ag{background:#f4f1ea;color:#222;border-color:#fff}#auth .ad{text-align:center;margin:2px 0 12px;font-size:12px;color:#8d7d57}#auth .ar{display:flex;gap:8px}#auth .ar button{margin:0}#auth .al{text-align:center;margin-top:14px;font-size:13px;color:#d6b866;text-decoration:underline;cursor:pointer}#auth .am{min-height:18px;margin-top:12px;text-align:center;font-size:13px;color:#c8b894}#auth .am.bad{color:#ff8a7a}</style>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script>
window.startRealm=()=>{'use strict';
const $=id=>document.getElementById(id);
const FALLBACK=[-89.0940,42.2711]; // [lng,lat]
const START={zoom:16.6,pitch:62,bearing:-18};

function tooFar(d){const e=$('toolFar');e.innerHTML='Too Far Away'+(d!=null?'<small>'+ft(d)+' away</small>':'');e.classList.add('show');clearTimeout(tooFar.t);tooFar.t=setTimeout(()=>e.classList.remove('show'),2000)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2800)}

/* ---------- Geo helpers ---------- */
const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function dest([lng,lat],bearingDeg,meters){const b=rad(bearingDeg),d=meters/R,la=rad(lat),lo=rad(lng);const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));return[deg(lo2),deg(la2)]}
function dist([lng1,lat1],[lng2,lat2]){const dLa=rad(lat2-lat1),dLo=rad(lng2-lng1);const a=Math.sin(dLa/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function ringPoly(c,m,n=72,props={}){const pts=[];for(let i=0;i<=n;i++)pts.push(dest(c,i*360/n,m));return{type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:[pts]}}}

/* ---------- Generated terrain textures (no image files needed) ---------- */
function rng(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function canvasImg(S,fn){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');fn(g,S);return g.getImageData(0,0,S,S)}
function canopyBlob(g,cx,cy,rd){const gr=g.createRadialGradient(cx-rd*.3,cy-rd*.35,rd*.1,cx,cy,rd);gr.addColorStop(0,'rgba(125,180,84,.95)');gr.addColorStop(.55,'rgba(44,104,52,.95)');gr.addColorStop(1,'rgba(12,42,26,.92)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,rd,0,6.2832);g.fill()}
const PATTERNS={
 canopy:()=>canvasImg(128,(g,S)=>{const r=rng(7);for(let i=0;i<26;i++){const x=r()*S,y=r()*S,rd=9+r()*9;for(const dx of[-S,0,S])for(const dy of[-S,0,S]){const cx=x+dx,cy=y+dy;if(cx<-rd||cx>S+rd||cy<-rd||cy>S+rd)continue;canopyBlob(g,cx,cy,rd)}}}),
 groves:()=>canvasImg(128,(g,S)=>{const r=rng(21);for(let i=0;i<5;i++)canopyBlob(g,16+r()*(S-32),16+r()*(S-32),7+r()*5)}),
 tufts:()=>canvasImg(64,(g,S)=>{const r=rng(5);g.lineCap='round';g.lineWidth=1.3;for(let i=0;i<16;i++){const x=6+r()*(S-12),y=9+r()*(S-15),light=r()>.5;g.strokeStyle=light?'rgba(176,220,112,.5)':'rgba(24,70,30,.5)';for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(x+k*2,y);g.lineTo(x+k*3.4,y-4-r()*2);g.stroke()}}}),
 rows:()=>canvasImg(32,(g,S)=>{for(let x=0;x<S;x+=8){g.fillStyle='rgba(235,222,120,.12)';g.fillRect(x,0,4,S);g.fillStyle='rgba(20,52,12,.14)';g.fillRect(x+4,0,4,S)}}),
 waves:()=>canvasImg(48,(g,S)=>{const r=rng(11);g.strokeStyle='rgba(205,242,255,.4)';g.lineWidth=1.2;for(let i=0;i<5;i++){const x=10+r()*(S-20),y=8+r()*(S-16);g.beginPath();g.arc(x,y,4+r()*3,Math.PI*1.1,Math.PI*1.9);g.stroke()}})
};

/* ---------- Fantasy map style built on free OpenFreeMap vector tiles ---------- */
const roadWidth=m=>['interpolate',['exponential',1.5],['zoom'],10,['match',['get','class'],['motorway','trunk','primary'],1*m,['secondary','tertiary'],.7*m,.4*m],18,['match',['get','class'],['motorway','trunk','primary'],14*m,['secondary','tertiary'],10*m,['path','track'],2.5*m,6*m]];
const roadW=roadWidth(1);
const style={version:8,name:'Realm',
sources:{om:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'}},
layers:[
{id:'bg',type:'background',paint:{'background-color':'#3d6a35'}},
{id:'lc-grass',type:'fill',source:'om','source-layer':'landcover',filter:['in',['get','class'],['literal',['grass','farmland']]],paint:{'fill-color':['match',['get','class'],'farmland','#6f8f3c','#4f8a3a']}},
{id:'farm-rows',type:'fill',source:'om','source-layer':'landcover',filter:['==',['get','class'],'farmland'],paint:{'fill-pattern':'rows'}},
{id:'tufts',type:'fill',source:'om','source-layer':'landcover',filter:['in',['get','class'],['literal',['grass','farmland']]],paint:{'fill-pattern':'tufts'}},
{id:'lc-sand',type:'fill',source:'om','source-layer':'landcover',filter:['in',['get','class'],['literal',['sand','rock']]],paint:{'fill-color':'#a8946a'}},
{id:'lc-wet',type:'fill',source:'om','source-layer':'landcover',filter:['==',['get','class'],'wetland'],paint:{'fill-color':'#35744f'}},
{id:'park',type:'fill',source:'om','source-layer':'park',paint:{'fill-color':'#3f8a45','fill-opacity':.9}},
{id:'park-tufts',type:'fill',source:'om','source-layer':'park',paint:{'fill-pattern':'tufts'}},
{id:'park-groves',type:'fill',source:'om','source-layer':'park',paint:{'fill-pattern':'groves'}},
{id:'lu-res',type:'fill',source:'om','source-layer':'landuse',filter:['in',['get','class'],['literal',['residential','suburb','neighbourhood','commercial','retail','industrial']]],paint:{'fill-color':'#5f6f3a','fill-opacity':.55}},
{id:'wood',type:'fill',source:'om','source-layer':'landcover',filter:['==',['get','class'],'wood'],paint:{'fill-color':'#1f4d2a'}},
{id:'wood-trees',type:'fill',source:'om','source-layer':'landcover',filter:['==',['get','class'],'wood'],paint:{'fill-pattern':'canopy'}},
{id:'water',type:'fill',source:'om','source-layer':'water',paint:{'fill-color':'#1f6a96'}},
{id:'water-shine',type:'fill',source:'om','source-layer':'water',paint:{'fill-pattern':'waves'}},
{id:'water-edge',type:'line',source:'om','source-layer':'water',paint:{'line-color':'#8fe0ea','line-opacity':.55,'line-width':['interpolate',['linear'],['zoom'],12,.8,18,3],'line-blur':1}},
{id:'waterway',type:'line',source:'om','source-layer':'waterway',paint:{'line-color':'#2b7fae','line-width':['interpolate',['exponential',1.4],['zoom'],10,.8,18,8]}},
{id:'road-case',type:'line',source:'om','source-layer':'transportation',filter:['!',['in',['get','class'],['literal',['rail','transit','ferry']]]],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2a1d0f','line-opacity':.55,'line-width':roadWidth(1.5)}},
{id:'road',type:'line',source:'om','source-layer':'transportation',filter:['!',['in',['get','class'],['literal',['rail','transit','ferry']]]],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['match',['get','class'],['motorway','trunk','primary'],'#d9bd7c',['secondary','tertiary'],'#c9a96a','#b89560'],'line-width':roadW}},
{id:'road-hi',type:'line',source:'om','source-layer':'transportation',filter:['!',['in',['get','class'],['literal',['rail','transit','ferry']]]],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f3deaa','line-opacity':.55,'line-width':roadWidth(.3)}},
{id:'building',type:'fill-extrusion',source:'om','source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],6],0,'#9c7a52',12,'#8b7355',40,'#8a8794'],'fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.92,'fill-extrusion-vertical-gradient':true}}
]};

const map=new maplibregl.Map({container:'map',style,center:FALLBACK,zoom:START.zoom,pitch:START.pitch,bearing:START.bearing,maxPitch:75,minZoom:12,maxZoom:19.5,attributionControl:{compact:true},dragRotate:true,touchPitch:false});
map.dragPan.disable();map.doubleClickZoom.disable();map.scrollZoom.enable({around:'center'});map.touchZoomRotate.enable({around:'center'});
let gesturing=false;
['touchstart','pointerdown'].forEach(ev=>map.getCanvasContainer().addEventListener(ev,()=>{gesturing=true},{passive:true}));
['touchend','touchcancel','pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,e=>{if(!e.touches||e.touches.length===0)setTimeout(()=>{gesturing=false},120)},{passive:true}));
map.getCanvasContainer().style.touchAction='none';
map.on('styleimagemissing',e=>{const f=PATTERNS[e.id];if(f&&!map.hasImage(e.id))map.addImage(e.id,f(),{pixelRatio:2})});
let errShown=false;map.on('error',e=>{console.error(e&&e.error||e);if(!errShown){errShown=true;const m=(e&&e.error&&e.error.message)||'unknown error';toast('Map problem: '+m.slice(0,140))}});

/* ---------- Game layers ---------- */
const RANGE=150; // meters: radius of the circle around the player (diameter = 2 x RANGE)
let player=FALLBACK.slice(),following=false,watchId=null,playerMarker=null;
const SVG={
 quest:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 3h3l-.6 11h-1.8zM12 16.6a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8z"/></svg>',
 chest:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11V8a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v3"/><rect x="3" y="11" width="18" height="9" rx="1.5"/><path d="M3 14h18M12 12v4"/></svg>',
 nature:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21v-8M12 13C7 13 4 9.5 4 4c5.5 0 8 3 8 9zM12 13c0-4 2-7 8-7 0 5-3 7-8 7z"/><path d="M12 21v-8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
 boss:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-4.7 0-8 3.2-8 7.3 0 2.5 1.2 4.3 2.8 5.4V19h2.6v-1.8h1.2V19h2.8v-1.8h1.2V19h2.6v-3.8c1.6-1.1 2.8-2.9 2.8-5.4 0-4.1-3.3-7.3-8-7.3zM8.7 12.8a1.9 1.9 0 1 1 0-3.8 1.9 1.9 0 0 1 0 3.8zm6.6 0a1.9 1.9 0 1 1 0-3.8 1.9 1.9 0 0 1 0 3.8z"/></svg>',
 rift:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>'};
const LABEL={quest:'Quest',chest:'Treasure Chest',nature:'Nature Discovery',boss:'Dark Lair (Boss)',rift:'Arcane Rift'};
// Sample layout around the player (meters / compass bearing). Replace with real server data later.
const SAMPLE=[
 {t:'quest',name:'Investigate the Strange Lights',d:125,b:20},{t:'quest',name:'The Whispering Door',d:230,b:250},
 {t:'chest',d:90,b:150},{t:'chest',d:270,b:80},{t:'chest',d:310,b:305},
 {t:'nature',d:170,b:335},{t:'nature',d:285,b:200},
 {t:'rift',d:240,b:115}];
let items=[],markers=[];
function mkEl(t){const el=document.createElement('div');el.className='mk '+t;el.innerHTML='<div class="beam"></div><div class="float"><div class="badge"><i>'+SVG[t]+'</i></div><div class="tip"></div></div><div class="ground"></div>';return el}
const POI={
 quest:{icon:'📜',title:it=>it.name,text:'Something strange stirs nearby. Investigate to begin the quest.',go:'Begin Quest'},
 chest:{icon:'🧰',title:()=>'Treasure Chest',text:'A chest lies within reach. Open it to claim your loot.',go:'Open Chest'},
 nature:{icon:'🌿',title:()=>'Nature Discovery',text:'Something rare grows here. Gather it before it fades.',go:'Gather'},
 rift:{icon:'✨',title:()=>'Arcane Rift',text:'The air shimmers and tears open. Step through if you dare.',go:'Enter Rift'},
 boss:{icon:'💀',title:()=>'Dark Lair',text:'A powerful foe lurks within. Prepare yourself before you strike.',go:'Challenge'}};
function openPoi(it){if(it.gone)return;const d=dist(targetLL,it.ll);
 if(d>RANGE){tooFar(d);return}
 if((it.t==='chest'||it.t==='boss')&&S.hero.downed){toast('You are downed. Recover to 25% HP first ('+Math.floor(100*S.hero.hp/stats().hp)+'% now).');return}
 const c=POI[it.t];
 showModal('poi',{icon:c.icon,title:c.title(it),text:ft(d)+' away. '+c.text+(it.exp?' Vanishes in '+Math.max(1,Math.ceil((it.exp-Date.now())/6e4))+' min.':'')+' (Sample marker, not a live event yet.)',primary:c.go,onPrimary:()=>{hideModal('poi');if(dist(targetLL,it.ll)>RANGE)return tooFar(dist(targetLL,it.ll));if(it.used||it.busy)return;it.busy=true;(it.t==='chest'||it.t==='boss'?lootFrom(it):it.t==='nature'?gatherNature(it):markerUse(it)).finally(()=>{it.busy=false})},secondary:'Close',onSecondary:()=>hideModal('poi')})}
function spawn(){const c=safeCtx();if(!c.ready){if((spawn.r=(spawn.r||0)+1)<8)map.once('idle',()=>setTimeout(spawn,400));return}spawn.r=0;syncWorld()}
function updateCards(){items.forEach((it,i)=>{const m=markers[i];if(!m)return;const near=dist(targetLL,it.ll)<=RANGE,el=m.getElement();el.classList.toggle('near',near);el.classList.toggle('far',!near)});
 }

function makePlayerEl(){const el=document.createElement('div');el.className='pl';el.innerHTML='<div class="col"></div><div class="disc"></div><svg viewBox="0 0 36 62"><path d="M18 2C10 2 7 10 8 19L2 59h32L28 19C29 10 26 2 18 2z" fill="#1b1a24" stroke="#7ad9ff" stroke-width="1.4"/><ellipse cx="18" cy="17" rx="6" ry="7.5" fill="#07070b"/><circle cx="15.3" cy="17" r="1" fill="#8fe8ff"/><circle cx="20.7" cy="17" r="1" fill="#8fe8ff"/><path d="M9 38h18" stroke="#c9a65a" stroke-width="2"/><path d="M18 26v30" stroke="#2c2b3a" stroke-width="1.2"/></svg>';return el}

/* ---------- Player glide + camera lock ---------- */
// player = position shown on screen (glides smoothly); targetLL = latest real GPS fix.
let targetLL=player.slice(),gotFirst=false,gpsLost=false,lastFix=0,intro=false,probing=false,rangeAt=[0,0],spawnAt=null;
map.setPadding({top:Math.round(window.innerHeight*0.22),bottom:0,left:0,right:0}); // player sits lower on screen, like Pokémon GO
function setFollow(on){following=on}
let frameN=0;
function frame(now){track();
 const dx=targetLL[0]-player[0],dy=targetLL[1]-player[1],moved=Math.abs(dx)>1e-9||Math.abs(dy)>1e-9;
 if(moved){player=[player[0]+dx*.12,player[1]+dy*.12];playerMarker.setLngLat(player);
  if(dist(player,rangeAt)>.5){rangeAt=player.slice();map.getSource('range').setData(ringPoly(player,RANGE))}}
 const p=(now%2600)/2600;
 if(!gesturing&&(frameN++%3===0))map.getSource('pulse').setData(ringPoly(player,25+125*p,72,{o:+(0.9*(1-p)).toFixed(2)}));
 if(moved&&following&&!intro&&gotFirst&&!gesturing&&!map.isEasing())map.jumpTo({center:player}); // map stays anchored on the player
 requestAnimationFrame(frame)}

map.on('load',()=>{
 const collapseAttr=()=>{const c=document.querySelector('.maplibregl-ctrl-attrib');if(c){c.classList.remove('maplibregl-compact-show');c.removeAttribute('open')}};collapseAttr();map.once('idle',collapseAttr);setTimeout(collapseAttr,1500); // attribution stays available behind the (i) button, just starts closed
 map.addSource('range',{type:'geojson',data:ringPoly(player,RANGE)});
 map.addSource('pulse',{type:'geojson',data:ringPoly(player,60,72,{o:1})});
 map.addLayer({id:'range-fill',type:'fill',source:'range',paint:{'fill-color':'#66e1f2','fill-opacity':.07}});
 map.addLayer({id:'range-line',type:'line',source:'range',paint:{'line-color':'#9eeeff','line-width':2,'line-opacity':.85,'line-dasharray':[3,2]}});
 map.addLayer({id:'pulse-line',type:'line',source:'pulse',paint:{'line-color':'#66e1f2','line-width':2.5,'line-opacity':['get','o']}});
 playerMarker=new maplibregl.Marker({element:makePlayerEl(),anchor:'bottom'}).setLngLat(player).addTo(map);
 spawn(player);rangeAt=player.slice();
 requestAnimationFrame(frame);
 boot();
});

/* ---------- Modal (permission prompt + errors) ---------- */
const modal=$('modal');let modalKind=null;

const polys=g=>g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];

 let o=`<div class="qcard ms"><div class="qt">${c?c.n:'No class'} · Level ${S.lvl}<span>${h.downed?'DOWNED (need 25%)':Math.floor(h.hp)+' / '+s.hp+' HP'}</span></div><div class="qbar"><i style="width:${Math.max(0,100*h.hp/s.hp)}%"></i></div><div class="qs"><b>ATK ${s.atk} · DEF ${s.def} · HP ${s.hp}</b></div><div class="qs">Level base: ${p.b.atk} ATK · ${p.b.def} DEF · ${p.b.hp} HP</div><div class="qs">Equipment: ${sg(p.g.atk)} ATK · ${sg(p.g.def)} DEF · ${sg(p.g.hp)} HP</div><div class="qs">Class: ${sg(p.cm.atk)} ATK · ${sg(p.cm.def)} DEF · ${sg(p.cm.hp)} HP</div>${c?lines(c):''}${chaosFx()?'<div class="qs">🎲 Chaos: '+fxText(chaosFx())+' ('+Math.ceil((chaosFx().until-Date.now())/6e4)+' min left)</div>':''}<button class="qbtn" data-a="cls">Change Class</button></div><div class="qh"><span>Potions</span></div>`;

 o+='<div class="qh"><span>Equipped</span></div>'+SLOTS.map(k=>h.eq[k]?row(h.eq[k],'Unequip','un',k).replace('<span>','<span>'+SN[k]+' · '):`<div class="qcard" style="opacity:.55"><div class="qt">${SN[k]}<span>Empty</span></div></div>`).join('');
 o+=`<div class="qh"><span>Backpack</span><span>${h.inv.length}</span></div>`+(h.inv.length?h.inv.map(it=>row(it,'Equip','eq',it.uid)).join(''):'<div class="qaw">No items yet. Open chests!</div>')+'<div class="qh"><span>Account</span></div><div class="qcard"><button class="qbtn" data-a="out">Sign out</button></div>';

H().hp=Math.min(H().hp,stats().hp);if(H().hp<=0)H().downed=true;recover();setInterval(()=>{recover();if(inv.classList.contains('open'))invRender()},1e4);if(!S.cls)openClass(true);

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
(()=>{'use strict';
// Supabase URL + publishable key are safe in front-end code: row-level security protects the data. NEVER put a secret/service_role key here.
const SB_URL='https://qaacpipifsofisbnxxzo.supabase.co',SB_KEY='sb_publishable_dGmwmCAUzbbZkNmpd2Xp7g_b77y2ZRu',QK='realm_quests_v1',OK='realm_owner';

const back=location.origin+location.pathname;let started=false,uid=null,lastS=null,lastJson='',timer=null,busy=false;

const NativeDate=Date;let clk={base:NativeDate.now(),t0:performance.now()},clockOn=false;
async function syncClock(){const t1=performance.now(),{data,error}=await sb.rpc('server_time');if(error)throw error;const t2=performance.now();clk={base:NativeDate.parse(data)+(t2-t1)/2,t0:t2}}   // performance.now() is monotonic, so later clock edits on the phone are ignored
const srvNow=()=>Math.round(clk.base+(performance.now()-clk.t0));
function installClock(){if(clockOn)return;clockOn=true;
 window.Date=new Proxy(NativeDate,{construct:(t,a,nt)=>Reflect.construct(t,a.length?a:[srvNow()],nt),apply:t=>t(srvNow()),get:(t,k)=>k==='now'?srvNow:k==='nativeNow'?()=>NativeDate.now():Reflect.get(t,k)});
 setInterval(()=>syncClock().catch(()=>{}),3e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncClock().catch(()=>{})})}
async function api(action,args){const{data,error}=await sb.functions.invoke('realm',{body:{action,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,...args}});
 if(error){let m='Connection problem. Try again.';try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}return{error:m}}return data&&data.error?{error:data.error}:(data||{error:'No answer from the server.'})}
async function flush(){if(!lastS||!uid)return true;const s=lastS,json=JSON.stringify(s);if(json===lastJson)return true;const L=Math.max(1,s.lvl|0),xp=Math.floor(s.xp||0);
 const r=await api('save',{state:s});if(r.error){console.warn('save failed',r.error);return false}lastJson=json;return true}

 try{const{data,error}=await sb.from('players').select('state').eq('id',uid).maybeSingle();if(error)throw error;
  const cloud=data&&data.state&&Object.keys(data.state).length?data.state:null,owner=localStorage.getItem(OK);

 window.realmCloud={queue,flush,signOut,api,sb,uid:()=>uid};el('auth').style.display='none';window.startRealm()}

const creds=()=>{const email=el('aEmail').value.trim(),password=el('aPass').value;if(!email||password.length<8)throw new Error('Enter your email and a password of 8+ characters.');return{email,password}};

sb.auth.onAuthStateChange((ev,session)=>{   // no awaits inside this callback (Supabase can deadlock); defer instead
