        cur = document.createElement('section'); cur.className = 'ob-s'; cur.innerHTML = html; root.appendChild(cur);
        if (bind) bind(cur); cur.offsetWidth; cur.classList.add('in'); cur.scrollTop = 0;
        const f = cur.querySelector('input[type=text]'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 700);
      }
      const q = (el, s) => el.querySelector(s);
      const panda = () => '<img class="pz" alt="" src="' + (window.PANDA_IMG || '') + '">';
      const screens = {
        async welcome() {
          // waits for a tap (no auto-advance): the panda wakes up, hops, then the next screen opens
          await show(panda() + '<h1>Welcome to<em>Titan\'s Path!</em></h1><p class="sub tap">Tap to begin</p>', el => { el.onclick = () => { if (el.dataset.go) return; el.dataset.go = '1'; const p = q(el, '.pz'); if (p) p.classList.add('wake'); setTimeout(() => go('name'), reduce ? 20 : 520); }; });
        },
        async name() {
          const links = (o.terms || o.privacy) ? ` the ${o.terms ? `<a href="${esc(o.terms)}" target="_blank" rel="noopener">Terms</a>` : ''}${o.terms && o.privacy ? ' and ' : ''}${o.privacy ? `<a href="${esc(o.privacy)}" target="_blank" rel="noopener">Privacy Policy</a>` : ''}` : ' the Terms and Privacy Policy';
          await show(`<h1>Who are you?</h1><p class="sub">Choose the name the Realm will remember.</p>
            <input type="text" id="obn" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Your name" aria-label="Player name" value="${esc(st.name)}">
            <p class="err" id="obe" role="alert">${esc(st.nameErr)}</p><p class="hint">3 to 16 letters, numbers, spaces, _ - '</p>
            <label class="chk"><input type="checkbox" id="oba" ${st.agree ? 'checked' : ''}><span>I am ${minAge} or older and I agree to${links}.</span></label>
            <button class="obb" id="obc" disabled>Continue</button>`, el => {
            const inp = q(el, '#obn'), chk = q(el, '#oba'), btn = q(el, '#obc'), err = q(el, '#obe');
            const clean = () => inp.value.trim().replace(/\s+/g, ' ');
            const upd = () => { st.name = clean(); st.agree = chk.checked; st.nameErr = ''; err.textContent = (st.name && !NAME_RE.test(st.name)) ? 'Use 3 to 16 letters, numbers, spaces, _ - or \'.' : ''; btn.disabled = !(NAME_RE.test(st.name) && st.agree); };
            const keep = st.nameErr; inp.oninput = upd; chk.onchange = upd; upd(); if (keep) err.textContent = keep;
            const next = () => { if (!btn.disabled) go(o.hasClass ? 'look' : 'type'); };
            btn.onclick = next; inp.onkeydown = e => { if (e.key === 'Enter') next(); };
          });
        },
        async type() {
          await show(`<h1>What type of player are you?</h1><p class="sub">You can always grow in other ways.</p>
            <button class="ot" data-t="fighter"><b>Fighter</b><span>Strong in battle: Dark Lairs, mimics and combat bonuses.</span></button>
            <button class="ot" data-t="explorer"><b>Explorer</b><span>Rewarded for walking, nature and faster XP.</span></button>
            <button class="ot" data-t="any"><b>Nothing Specific</b><span>Browse every class.</span></button>
            <button class="obb ghost" id="ob-back">Back</button>`, el => {
            el.onclick = e => { const b = e.target.closest('[data-t]'); if (b) { st.type = b.dataset.t; go('cls') } else if (e.target.id === 'ob-back') go('name'); };
          });
        },
        async cls() {
          const ids = st.type === 'any' ? classes.map(c => c.id) : (groups[st.type] || []);
          const list = classes.filter(c => ids.includes(c.id));
          if (st.cls && !list.some(c => c.id === st.cls)) st.cls = null;
          const title = { fighter: 'Fighters', explorer: 'Explorers', any: 'Every class' }[st.type] || 'Classes';
          await show(`<h1>${title}</h1><p class="sub">Choose how you play.</p>${list.map(c => `<button class="oc${c.id === st.cls ? ' sel' : ''}" data-c="${esc(c.id)}"><b>${esc(c.name)}</b><p>${esc(c.desc)}</p><ul>${(c.pros || []).map(x => `<li class="p">+ ${esc(x)}</li>`).join('')}${(c.cons || []).map(x => `<li class="n">&minus; ${esc(x)}</li>`).join('')}</ul></button>`).join('')}
            <button class="obb" id="ob-ok" ${st.cls ? '' : 'disabled'}>Choose</button><button class="obb ghost" id="ob-back">Back</button>`, el => {
            el.onclick = e => {
              const b = e.target.closest('[data-c]');
              if (b) { st.cls = b.dataset.c; el.querySelectorAll('.oc').forEach(x => x.classList.toggle('sel', x === b)); q(el, '#ob-ok').disabled = false; }
              else if (e.target.id === 'ob-ok' && st.cls) go('look'); else if (e.target.id === 'ob-back') go('type');
            };
          });
        },
        async look() {
          await show(`<h1>Choose your look</h1><div class="olp"><img id="olp" alt="" src="${esc(o.lookUrl(st.look))}"></div><p class="sub" id="oln">${cap(st.look)}</p>
            <div class="olg">${looks.map(l => `<button class="ol${l === st.look ? ' sel' : ''}" data-l="${esc(l)}" aria-label="${cap(l)}"><img alt="" src="${esc(o.lookUrl(l))}">${cap(l)}</button>`).join('')}</div>
            <p class="err" id="obe" role="alert"></p><button class="obb" id="ob-ok">Begin your journey</button><button class="obb ghost" id="ob-back">Back</button>`, el => {
            const err = q(el, '#obe'), ok = q(el, '#ob-ok');
            el.onclick = async e => {
              const b = e.target.closest('[data-l]');
              if (b) { st.look = b.dataset.l; q(el, '#olp').src = o.lookUrl(st.look); q(el, '#oln').textContent = cap(st.look); el.querySelectorAll('.ol').forEach(x => x.classList.toggle('sel', x === b)); }
              else if (e.target.id === 'ob-back') go(o.hasClass ? 'name' : 'cls');
              else if (e.target.id === 'ob-ok') {
                ok.disabled = true; ok.textContent = 'Entering the Realm…'; err.textContent = '';
                let r; try { r = await o.submit({ name: st.name, cls: st.cls, look: st.look }); } catch (x) { r = { error: 'Connection problem. Please try again.' }; }
                if (r && r.error) { ok.disabled = false; ok.textContent = 'Begin your journey'; if (/name/i.test(r.error)) { st.nameErr = r.error; go('name'); } else err.textContent = r.error; return; }
                cur.classList.remove('in'); root.classList.remove('on'); await wait(850); root.remove(); resolve({ name: st.name, cls: st.cls, look: st.look });
              }
            };
          });
        } };
      const go = n => screens[n]();
      requestAnimationFrame(() => { root.classList.add('on'); go('welcome'); });
    });
  }
  g.Onboarding = { run, GROUPS };
})(window);

</script>
<script>

/* ---------- Geo helpers ---------- */
const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;

function dist([lng1,lat1],[lng2,lat2]){const dLa=rad(lat2-lat1),dLo=rad(lng2-lng1);const a=Math.sin(dLa/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))}

 groves:()=>canvasImg(128,(g,S)=>{const r=rng(21);for(let i=0;i<5;i++)canopyBlob(g,16+r()*(S-32),16+r()*(S-32),7+r()*5)}),
 tufts:()=>canvasImg(64,(g,S)=>{const r=rng(5);g.lineCap='round';g.lineWidth=1.3;for(let i=0;i<16;i++){const x=6+r()*(S-12),y=9+r()*(S-15),light=r()>.5;g.strokeStyle=light?'rgba(176,220,112,.5)':'rgba(24,70,30,.5)';for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(x+k*2,y);g.lineTo(x+k*3.4,y-4-r()*2);g.stroke()}}}),
 rows:()=>canvasImg(32,(g,S)=>{for(let x=0;x<S;x+=8){g.fillStyle='rgba(235,222,120,.12)';g.fillRect(x,0,4,S);g.fillStyle='rgba(20,52,12,.14)';g.fillRect(x+4,0,4,S)}}),

};

const POI={

 calaun:{icon:'🐉',title:()=>'Sir Calaun Dawnblight',text:'A wanted Dragonborn, and a bounty poster with a lot of zeros.',go:'Begin Quest'},

/* Sound framework. Drop files into the "audio" folder next to index.html. Sound effects live in audio/sfx/NAME.mp3, music in audio/music/NAME.mp3.
   Any file that is missing is simply silent. See audio/README.txt for the full list of names. */
const SND_BASE='audio/';
const HIT_GROUP={warrior:'melee',barbarian:'melee',paladin:'melee',antipaladin:'melee',monk:'melee',assassin:'melee',archer:'melee',scout:'melee',wizard:'magic',druid:'magic',healer:'magic',bard:'magic'};   // archer + scout use the melee hit until you add hit_ranged.mp3
const Sound=(()=>{let ctx=null,unlocked=false,want='map',el=null,seq=Promise.resolve();const bufs={},bad=new Set();
 const vol=k=>SET.mute?0:Math.max(0,Math.min(1,(SET.master/100)*(SET[k]/100)));
 function unlock(){if(unlocked)return;unlocked=true;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC();if(ctx&&ctx.state==='suspended')ctx.resume()}catch(e){}if(want)music(want)}
 async function load(n){if(bufs[n])return bufs[n];if(bad.has(n)||!ctx)return null;try{const r=await fetch(SND_BASE+'sfx/'+n+'.mp3');if(!r.ok)throw 0;const b=await ctx.decodeAudioData(await r.arrayBuffer());return bufs[n]=b}catch(e){bad.add(n);return null}}
 function play(n){return new Promise(async res=>{if(!unlocked||vol('sfx')<=0)return res(false);const b=await load(n);if(!b||!ctx)return res(false);try{if(ctx.state==='suspended')ctx.resume();const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=b;g.gain.value=vol('sfx');s.connect(g);g.connect(ctx.destination);let done=false;const fin=()=>{if(!done){done=true;res(true)}};s.onended=fin;setTimeout(fin,(b.duration||3)*1000+400);s.start(0)}catch(e){res(false)}})}
 const sfx=n=>play(n);                                                  // plays right away
 const queue=(...names)=>(seq=seq.then(()=>names.reduce((p,n)=>p.then(()=>play(n)),Promise.resolve())));   // plays one after another, each waits for the one before
 async function first(names){for(const n of names){if(!unlocked)return false;if(await load(n))return play(n)}return false}   // plays the first name that has a file
 function hit(cls){const g=HIT_GROUP[cls]||'melee',l=['hit_'+cls];if(cls==='archer'||cls==='scout')l.push('hit_ranged');l.push('hit_'+g);if(g!=='melee')l.push('hit_melee');return first(l)}

 function fromMsg(m){m=String(m||'');if(/Traveler's Request complete/i.test(m))queue('quest_complete');else if(/Traveler's Request: \d+ \/ \d+/i.test(m))queue('quest_progress');else if(/quest ran out of time/i.test(m))queue('quest_fail')}
 function music(n){want=n||null;if(!unlocked)return;if(el){el.pause();el=null}if(!n)return;const list=[n];if(n.indexOf('_')>0)list.push(n.split('_')[0]);   // battle_mimic falls back to battle
  const go=i=>{if(i>=list.length||bad.has('m:'+list[i])){if(i<list.length)go(i+1);return}const a=new Audio(SND_BASE+'music/'+list[i]+'.mp3');a.loop=true;a.volume=vol('music');a.onerror=()=>{bad.add('m:'+list[i]);if(el===a){el=null;go(i+1)}};el=a;if(!document.hidden)a.play().catch(()=>{})};go(0)}
 function refresh(){if(el)el.volume=vol('music')}
 let fT=0;   // music fades: fadeOut ramps the current track to silence, fadeIn starts a track at 0 and ramps it up
 function fadeOut(ms){return new Promise(res=>{clearInterval(fT);const a=el;if(!a||ms<=0){if(a&&el===a){a.pause();el=null}return res()}const v0=a.volume,t0=performance.now();fT=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=v0*(1-k);if(k>=1){clearInterval(fT);if(el===a){a.pause();el=null}res()}},40)})}

 const now=()=>el?want:null;
 document.addEventListener('visibilitychange',()=>{if(!el)return;if(document.hidden)el.pause();else el.play().catch(()=>{})});
 ['pointerdown','touchstart','keydown'].forEach(e=>addEventListener(e,unlock,{passive:true}));   // phones only allow sound after the first touch
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button,.nav-item,[data-act],[data-m],[data-c],[role=button]');if(b&&!b.closest('#setModal'))sfx('tap')},true);   // buttons, the bottom menu tabs and tappable menu cards
 return{sfx,queue,hit,levelUp,fromMsg,music,refresh,unlock,fadeOut,fadeIn,now}})();

const FPS=(()=>{let iv=0,last=0,curT=-1,curOk=true,installed=false,nid=1;const raf=window.requestAnimationFrame.bind(window),caf=window.cancelAnimationFrame.bind(window),live=new Map();

  window.requestAnimationFrame=cb=>{const id=nid++,go=()=>{live.set(id,raf(t=>{if(!live.has(id))return;if(decide(t)){live.delete(id);cb(t)}else go()}))};go();return id};
  window.cancelAnimationFrame=id=>{if(live.has(id)){caf(live.get(id));live.delete(id)}else caf(id)}}

/* ---- Chaos: Tempt Fate (virtual d20) ---- */
const CHAOS_CD=36e5,CHAOS_DUR=36e5;   // one roll per hour; effects last 1 hour (so only one effect is ever active)
const CHAOS={cfail:['Critical Failure','Fate turns on you.'],omen:['Dim Omen','A cold wind follows you.'],shrug:['Fate Shrugs','Nothing stirs. Chaos is content, for now.'],blessing:['Small Blessing','A warm thread of luck.'],explore:["Wanderer's Luck",'The road opens before you.'],potion:['Windfall','You find a Small HP Potion.'],surge:['Second Wind','Fate restores you to full health.'],cwin:['Critical Success','Fate smiles on you.']};
const fxText=f=>f.k==='stat'?sg(f.pct)+'% '+f.stat.toUpperCase():f.k==='xp'?sg(f.pct)+'% XP':'+'+f.v+' Exploration';
/* Chaos card. The d20 is still rolled and stored on the SERVER (A.tempt); this only plays the animation up to the number the server returns. */
const CD={cur:19,busy:false,spin:false,to:0,still:matchMedia('(prefers-reduced-motion:reduce)').matches};
const cdFrame=i=>{CD.cur=i;$('cdie').style.backgroundPosition=(i*100/19)+'% 0'};
function cdFit(el,max){el.style.fontSize=max+'cqw';let s=max;while(el.scrollWidth>el.clientWidth+1&&s>3.6){s-=.3;el.style.fontSize=s+'cqw'}}
function cdSet(o){const d=$('cdie');d.classList.remove('land','spin');$('cnum').textContent=o.num==null?'':o.num;$('cname').textContent=o.name;cdFit($('cname'),7.4);
 const b=$('cbody');b.textContent='';(o.lines||[]).forEach(([cls,t,icon])=>{const d=document.createElement('div');d.className=cls;if(icon){const i=document.createElement('i');d.appendChild(i);d.appendChild(document.createTextNode(t))}else d.textContent=t;b.appendChild(d)});
 const g=$('cgo');g.textContent=o.btn;g.disabled=!!o.off;g.onclick=o.on||null;const n=$('cno');n.style.display=o.no?'':'none';n.onclick=chaosClose}
function chaosClose(){if(CD.busy)return;$('chaosOv').classList.remove('open');hideModal('chaos')}
function cdSpin(){CD.spin=true;$('cdie').classList.add('spin');(function loop(){if(!CD.spin)return;cdFrame((CD.cur+1)%20);CD.to=setTimeout(loop,55)})()}
function cdLand(target,done){CD.spin=false;clearTimeout(CD.to);const t=target-1,steps=CD.still?0:20+((t-CD.cur+20)%20);let k=0;   // one full lap, then slow down onto the rolled face
 (function tick(){if(k>=steps){cdFrame(t);return done()}k++;cdFrame((CD.cur+1)%20);CD.to=setTimeout(tick,40+110*Math.pow(k/steps,2.4))})()}
function chaosOpen(){const C=S.chaos||(S.chaos={last:0,fx:null}),wait=C.last+CHAOS_CD-Date.now(),f=chaosFx();
 $('chaosOv').classList.add('open');cdFrame(19);
 if(wait>0)return cdSet({name:'Chaos',num:'',lines:[['chTxt','Fate is quiet. Return in '+Math.ceil(wait/6e4)+' min.']].concat(f?[['chFx','Active: '+fxText(f)+' ('+Math.ceil((f.until-Date.now())/6e4)+' min left)']]:[]),btn:'OK',on:chaosClose});
 cdSet({name:'Chaos',num:'?',lines:[['chTxt','Chaos is in the eye of the beholder.']],btn:'Tempt Fate',on:tempt,no:true})}
async function tempt(){if(CD.busy)return;CD.busy=true;cdSet({name:'Fate is turning…',num:'',lines:[],btn:'…',off:true});cdSpin();const t0=Date.now();
 const r=await act('tempt',{});   // the d20 is rolled and stored on the SERVER: reloading or editing the save can't change it
 const fail=(name,msg)=>{CD.spin=false;clearTimeout(CD.to);CD.busy=false;cdFrame(19);cdSet({name,num:'',lines:[['chTxt',msg]],btn:'OK',on:chaosClose})};
 if(!r)return fail('Fate is silent',(act.err||'Could not reach the server.')+'\nTry again in a moment.');
 if(!r.result||!CHAOS[r.result.res]){console.warn('tempt: unexpected server reply',r);return fail('Fate is tangled','The server answered, but not in a form the game understands.')}
 const{roll,eff,res,fx,extra}=r.result;
 await new Promise(ok=>setTimeout(ok,Math.max(0,700-(Date.now()-t0))));   // always spin a moment, even on a fast connection
 cdLand(roll,()=>{CD.busy=false;$('cdie').classList.add('land');
  cdSet({name:CHAOS[res][0],num:eff,lines:[['chRow','D20 roll: '+roll,1]].concat(eff!==roll?[['chTxt','Counts as '+eff]]:[],[['chTxt',CHAOS[res][1]]]).concat(fx?[['chFx','Effect: '+fxText(fx)+' for 60 minutes']]:extra?[['chFx',extra]]:[]),btn:'Accept Fate',on:chaosClose});
  $('cdie').classList.add('land');hud();if(inv.classList.contains('open'))invRender()})}
$('chaosButton').addEventListener('click',chaosOpen);

function ptLater(fn,ms){PT.timers.push(setTimeout(fn,ms))}

function ptBuild(){
  if(PT.el)return;
  try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IM+Fell+English&display=swap';document.head.appendChild(l)}catch(e){}
  const st=document.createElement('style');st.textContent=PT_CSS;document.head.appendChild(st);
  const el=document.createElement('div');el.id='portalOv';el.innerHTML=PT_HTML;document.body.appendChild(el);PT.el=el;
  const stage=el.querySelector('#ptStage');
  stage.addEventListener('click',ptEnter);
  stage.addEventListener('pointermove',e=>{if(PT.state!=='idle')return;const r=stage.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;stage.style.transform='rotateY('+(px*5)+'deg) rotateX('+(-py*4)+'deg)'});
  stage.addEventListener('pointerleave',()=>{if(PT.state==='idle')stage.style.transform=''});
  el.querySelector('#ptBack').addEventListener('click',()=>{if(PT.state==='idle')ptHide(true)});
  addEventListener('resize',ptResize);
}

/* ---- particles (same as the preview, only runs while the portal is on screen) ---- */
const PT_G={cx:.493,cy:.527,rx:.19,ry:.31},PT_COLS=['#4fe3ff','#9a7bff','#ffffff','#ffc878'],PT_LANT=[[.224,.21],[.77,.265],[.148,.735],[.917,.70],[.975,.80]];
let ptW=0,ptH=0,ptSparks=[],ptEmbers=[],ptFlies=[];
function ptResize(){
  if(!PT.el||!PT.open)return;
  const stage=PT.el.querySelector('#ptStage'),cv=PT.el.querySelector('#ptFx'),d=Math.min(devicePixelRatio||1,2);
  ptW=stage.offsetWidth;ptH=stage.offsetHeight;cv.width=ptW*d;cv.height=ptH*d;cv.getContext('2d').setTransform(d,0,0,d,0,0);
  PT.el.querySelector('#ptDisp').setAttribute('scale',Math.round(ptW*.022));
}
function ptSpark(s,fresh){s.t=Math.random()*6.283;s.r=fresh?Math.random():1;s.v=.12+Math.random()*.25;s.c=PT_COLS[(Math.random()*4)|0];s.z=.6+Math.random()*1.4;s.px=null;return s}
function ptEmber(e,fresh){const l=PT_LANT[(Math.random()*PT_LANT.length)|0];e.x=l[0]+(Math.random()-.5)*.02;e.y=l[1]-(fresh?Math.random()*.2:0);e.vy=.012+Math.random()*.03;e.ph=Math.random()*6.283;e.life=0;e.max=3+Math.random()*4;e.z=.6+Math.random()*1.2;return e}
function ptStart(){
  const low=SET.fx==='low'||SET.low;
  ptSparks=[];ptEmbers=[];ptFlies=[];
  for(let i=0;i<(low?40:90);i++)ptSparks.push(ptSpark({},true));
  for(let i=0;i<(low?10:28);i++)ptEmbers.push(ptEmber({},true));
  for(let i=0;i<(low?6:18);i++)ptFlies.push({x:Math.random(),y:.3+Math.random()*.6,ph:Math.random()*6.283,sp:.2+Math.random()*.3});
  PT.boost=1;PT.last=0;ptResize();
  if(SET.rm||SET.fx==='off')return;   // reduced motion / effects off: still image, no particles
  const ctx=PT.el.querySelector('#ptFx').getContext('2d');
  const frame=ts=>{
    if(!PT.open)return;
    const dt=Math.min((ts-PT.last)/1000||.016,.05);PT.last=ts;
    ctx.clearRect(0,0,ptW,ptH);ctx.globalCompositeOperation='lighter';
    for(const s of ptSparks){
      s.t+=dt*(1.2+(1-s.r)*5)*PT.boost;s.r-=dt*s.v*PT.boost;if(s.r<.04)ptSpark(s);
      const x=(PT_G.cx+Math.cos(s.t)*s.r*PT_G.rx)*ptW,y=(PT_G.cy+Math.sin(s.t)*s.r*PT_G.ry)*ptH,a=Math.min(1,s.r*4)*.9;
      ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.globalAlpha=a;ctx.lineWidth=s.z*ptW/700;
      if(s.px!==null){ctx.beginPath();ctx.moveTo(s.px,s.py);ctx.lineTo(x,y);ctx.stroke()}
      ctx.beginPath();ctx.arc(x,y,s.z*ptW/600,0,6.283);ctx.fill();s.px=x;s.py=y;
    }
    for(const e of ptEmbers){
      e.life+=dt;e.y-=e.vy*dt*3;e.x+=Math.sin(e.life*2+e.ph)*.0004;if(e.life>e.max)ptEmber(e);
      ctx.globalAlpha=Math.sin(Math.min(1,e.life/e.max)*Math.PI)*.85;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(e.x*ptW,e.y*ptH,e.z*ptW/700,0,6.283);ctx.fill();
    }
    for(const f of ptFlies){
      f.ph+=dt*f.sp;f.x+=Math.cos(f.ph*1.3)*.0006;f.y+=Math.sin(f.ph)*.0004;
      ctx.globalAlpha=.35+.5*Math.sin(f.ph*4);ctx.fillStyle='#c8f4ff';ctx.shadowColor='#4fe3ff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(f.x*ptW,f.y*ptH,1.3*ptW/700,0,6.283);ctx.fill();ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;PT.boost+=(1-PT.boost)*dt*1.5;
    PT.raf=requestAnimationFrame(frame);
  };
  PT.raf=requestAnimationFrame(frame);
}

/* ---- open: the map marker tap lands here instead of the old pop-up box ---- */
function portalOpen(it){
  if(PT.open)return;
  ptBuild();
  PT.open=true;PT.state='idle';PT.it=it;PT.room=null;
  const el=PT.el,stage=el.querySelector('#ptStage');
  stage.style.transition='none';stage.style.transform='';stage.style.transformOrigin='';stage.offsetWidth;stage.style.transition='';
  stage.classList.remove('ptSurge');
  el.querySelector('#ptHint').classList.remove('gone');
  el.querySelector('#ptVoid').classList.remove('on');
  el.querySelector('#ptBack').classList.remove('hide');
  el.style.display='block';
  requestAnimationFrame(()=>{el.classList.add('on');ptStart()});
  // portal music: map music dips out, Portal.mp3 loops (Sound loops every music track) until the player taps the gate
  try{Sound.fadeOut(300).then(()=>{if(PT.open&&PT.state==='idle')Sound.fadeIn('portal',600)})}catch(e){}
}

/* ---- tap the gate: fly in, black out, portal music fades out, the room's music fades in ---- */
function ptEnter(){
  if(!PT.open||PT.state!=='idle')return;
  const it=PT.it;
  if(dist(targetLL,it.ll)>RANGE){tooFar(dist(targetLL,it.ll));ptHide(true);return}
  if(it.used||it.busy)return;
  PT.state='entering';it.busy=true;
  const el=PT.el,stage=el.querySelector('#ptStage'),voidEl=el.querySelector('#ptVoid');
  // ask the server now so the room is ready by the time the screen is black
  const _rm=r=>r&&r.result&&r.result.rift?r.result.rift.room:null,
    tryEnter=()=>useMarker(it,()=>act('rift',{op:'enter',key:it.key,exp:it.exp,ll:targetLL})).then(_rm,()=>null),
    tryResume=()=>act('rift',{op:'resume',quiet:true}).then(_rm,()=>null);
  // never bounce the player back out: if the call got lost, pick up the run the server already rolled, or roll once more
  PT.room=tryEnter().then(r=>r||(it.used||!act.err?tryResume():null)).then(r=>r||(!it.used&&!act.err?tryEnter():null)).catch(()=>null);
  el.querySelector('#ptBack').classList.add('hide');
  el.querySelector('#ptHint').classList.add('gone');        // 1. words fade
  stage.classList.add('ptSurge');PT.boost=7;                // 2. portal flares, sparks race
  ptLater(()=>{                                             // 3. fly into the gate
    stage.style.transformOrigin=(PT_G.cx*100)+'% '+(PT_G.cy*100)+'%';
    stage.style.transition='transform 2.4s cubic-bezier(.6,0,.3,1)';
    stage.style.transform='scale(8)';
  },500);
  ptLater(()=>{voidEl.classList.add('on');try{Sound.fadeOut(1500)}catch(e){}},1000);   // 4. fade to black, portal music fades out with it
  ptLater(async()=>{                                        // 5. black: room music fades in, room appears
    const room=await Promise.race([PT.room,new Promise(r=>setTimeout(()=>r(null),15000))]);it.busy=false;
    if(!PT.open)return;
    if(!room){ptHide(true);try{if(!act.err)toast('The rift fizzled out. Try again.')}catch(e){}return}                          // server said no (it already showed why): back to the map
    PT.state='inside';stage.classList.remove('ptSurge');
    try{Sound.fadeIn(PT_MUSIC[room.id]||'map',1400)}catch(e){}   // room track, or map music if the room has none
    try{rfRoom(room)}catch(e){console.warn('rift room',e);ptHide(true);try{toast('That rift room failed to open. Try another rift.')}catch(_){}}
  },3000);
}

/* ---- close: back to the map. toMap = also bring the map music back (rfClose does that itself after a finished rift) ---- */
function ptHide(toMap){
  if(!PT.open)return;
  PT.open=false;PT.state='idle';
  PT.timers.forEach(clearTimeout);PT.timers=[];cancelAnimationFrame(PT.raf);
  if(PT.it)PT.it.busy=false;
  const el=PT.el;el.classList.remove('on');
  setTimeout(()=>{if(PT.open)return;el.style.display='none';const s=el.querySelector('#ptStage');s.style.transition='none';s.style.transform='';s.offsetWidth;s.style.transition='';el.querySelector('#ptVoid').classList.remove('on')},650);
  if(toMap){try{if(Sound.now()!=='map')Sound.fadeOut(300).then(()=>Sound.fadeIn('map',700))}catch(e){}}
}

htseeing. Try to contain your excitement.", "Come along, furball. Adventure waits for no cat!"], "pos": "50% 50%"}, {"t": "Trouble in the Blackwater", "o": "Investigate 2 Dark Lairs or a nearby Rift.", "intro": ["Blackwater Cove. A miserable place full of miserable memories.", "My old hideout lies somewhere nearby. My former first mate swears there’s something guarding it now.", "He says it’s unnatural. Cursed. Possibly hungry.", "I told him he was being dramatic. Then I saw his face. He’s a terrible liar, and an even worse coward.", "Investigate the area. If something is lurking in those ruins, I want to know what it is.", "And keep your claws sharp. I didn’t survive this long by chasing every strange noise like an overexcited kitten."], "done": ["Something has taken up residence in my old hideout? Splendid. Just claw-ful.", "Whatever it is, it knows we’re looking for something. I can feel it.", "Keep your weapons close, adventurer. The deeper we dig, the uglier this gets.", "And remember: if something tries to eat you, make sure you give it indigestion."], "pos": "50% 50%"}, {"t": "The Compass of the Damned", "o": "Collect 5 Nature Discoveries to identify the compass’s destination.", "intro": ["Something’s wrong with my compass.", "It points north in the morning, east at noon, and straight into the wilderness by nightfall.", "I’ve tried shaking it. I’ve tried hitting it. I’ve even tried asking it politely.", "Nothing.", "Honestly, I’ve had catsnap naps that were more predictable than this cursed thing.", "Find out what it’s trying to show me. And if you discover that the compass is possessed, I expect you to deal with it.", "Now hurry up! I want answers, and I want them right meow!"], "done": ["An ancient ruin. Of course it is.", "Nothing good has ever come from an ancient ruin. They’re either full of monsters, cursed treasure, or both.", "Still, the compass has never led me astray. Not entirely, anyway.", "Prepare yourself. We’re getting close.", "And do try to keep up. I won’t paws for anyone!"], "pos": "50% 50%"}, {"t": "A Mutiny in the Making", "o": "Recover the stolen satchel containing Selora’s ship’s log at a marked location.", "intro": ["One of my crew has gone missing. Stolen my ship’s log, too.", "That log contains every secret I’ve spent twenty years keeping buried.", "If my former first mate has sold that information to the wrong people, we’ll have more than a mutiny on our hands.", "Find the stolen satchel. Bring me the log.", "And if you happen to find the thief, remind him that I have a very long memory.", "Oh, and tell him that if he thinks he can cross me and get away with it, he’s barking up the wrong tree.", "I may be a cat, but I don’t play around with my prey."], "done": ["So, my suspicions were correct.", "Someone has been searching for the artifact all this time.", "I thought the past was buried. Seems it was merely waiting for someone foolish enough to dig it up.", "There’s no turning back now.", "And when I find the traitor, I intend to have a very long conversation with him. One with plenty of hissing."], "pos": "35% 50%"}, {"t": "What Lies Beneath", "o": "Reach the final marked location and investigate the cursed treasure site.", "intro": ["All these years, I’ve hoped I’d never have to return to that place.", "The ghost ship. The missing crew. The compass. It all leads back to one cursed treasure.", "I’ve spent half my life chasing gold. Turns out the worst things in this world are the ones you find for free.", "Whatever lies beneath those ruins, it cannot be allowed to fall into the wrong hands.", "Come on, adventurer. Let’s finish what should have ended twenty years ago.", "And keep your tail out of trouble. I’d hate to lose you before the fun begins."], "done": ["It’s done, then.", "Twenty years of running, hiding, and pretending the past would leave me alone.", "Perhaps now I can finally sail without looking over my shoulder.", "You’ve earned my respect, adventurer. Don’t let it go to your head function done(){var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#000e;color:#f4e7c6;font:13px/1.5 Arial,sans-serif;padding:16px;overflow:auto;white-space:pre-wrap';
d.textContent='ART CHECK\nChecked '+u.length+' files. Missing: '+miss.length+'\n\n'+(miss.length?miss.join('\n'):'Nothing missing. If pictures still look broken, clear the cache (Menu > Account Management).')+'\n\n(tap to close)';d.onclick=function(){d.remove()};document.body.appendChild(d)}
next()})}catch(e){}})();
</script>
<script>
/* Chest FX: coin glints on the Treasure Chest dialog, flickering wall torches behind the Chest Opened (loot) dialog.
   Pure canvas overlay, no art files needed. Respects Reduced Motion and Effects Off; Effects Low halves the particles. */
(function(){
const modal=document.getElementById('modal');if(!modal)return;
const R=Math.random,rt=document.documentElement.classList;
let mode=null,raf=0,last=0,cb,cf,xb,xf,glints=[],embers=[];
const st=document.createElement('style');st.textContent='#modal>.modal-card{position:relative;z-index:1}';document.head.appendChild(st);
function mk(z){const c=document.createElement('canvas');c.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:'+z;c.setAttribute('aria-hidden','true');modal.appendChild(c);return c}
function fit(){if(!cb)return;const d=devicePixelRatio||1,w=modal.clientWidth,h=modal.clientHeight;[cb,cf].forEach(c=>{c.width=Math.max(1,w*d);c.height=Math.max(1,h*d)});xb.setTransform(d,0,0,d,0,0);xf.setTransform(d,0,0,d,0,0)}
const mult=()=>rt.contains('fx-low')?.5:1;
function star(x,px,py,r,a){if(a<.02)return;x.globalAlpha=a;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'#fff8d0');g.addColorStop(.3,'rgba(255,215,90,.6)');g.addColorStop(1,'rgba(255,190,50,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,6.283);x.fill();x.strokeStyle='#fff6c8';x.lineWidth=1.2;x.beginPath();x.moveTo(px-r*1.6,py);x.lineTo(px+r*1.6,py);x.moveTo(px,py-r*1.6);x.lineTo(px,py+r*1.6);x.stroke()}
function coins(t,cx,cy,W){const H0=W*.32;xf.globalCompositeOperation='lighter';
 const p=.5+.5*Math.sin(t*1.6);let g=xf.createRadialGradient(cx+W*.5,cy+H0*.7,0,cx+W*.5,cy+H0*.7,W*.38);g.addColorStop(0,'rgba(255,190,60,'+(.1+.1*p)+')');g.addColorStop(1,'rgba(255,160,30,0)');xf.globalAlpha=1;xf.fillStyle=g;xf.fillRect(cx,cy,W,H0*1.3);
 glints.forEach(q=>star(xf,cx+q.u*W,cy+q.v*H0,q.r*W,Math.pow(Math.max(0,Math.sin(t*q.s+q.p)),10)));
 xf.globalCompositeOperation='source-over';xf.globalAlpha=1}
function flame(x,px,py,s,t,seed){const n=Math.sin(t*9+seed)*.5+Math.sin(t*14.3+seed*2)*.3+Math.sin(t*23+seed*3)*.2,k=1+.18*n;
 let g=x.createRadialGradient(px,py,0,px,py,s*6*k);g.addColorStop(0,'rgba(255,150,40,.4)');g.addColorStop(1,'rgba(255,100,20,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,s*6*k,0,6.283);x.fill();
 const sw=Math.sin(t*6+seed)*s*.25;
 [['rgba(255,110,20,.8)',1,1],['rgba(255,190,60,.9)',.65,.8],['rgba(255,245,190,.95)',.32,.55]].forEach(([c,sc,hh])=>{x.fillStyle=c;x.beginPath();x.ellipse(px+sw*sc,py-s*.5*k*hh,s*.55*sc*(1+.08*n),s*1.1*k*sc,0,0,6.283);x.fill()})}
const TORCH=[[.05,.2],[.95,.2],[.05,.68],[.95,.68]];
function torches(t,dt,w,h){const s=Math.max(10,Math.min(16,w*.035));
 xb.globalCompositeOperation='source-over';xb.globalAlpha=1;
 TORCH.forEach(q=>{const px=q[0]*w,py=q[1]*h;xb.fillStyle='#2b1a0e';xb.fillRect(px-s*.18,py,s*.36,s*3.4);xb.fillStyle='#51565f';xb.fillRect(px-s*.32,py+s,s*.64,s*.25);xb.fillStyle='#3a2410';xb.beginPath();xb.ellipse(px,py,s*.55,s*.4,0,0,6.283);xb.fill()});
 xb.globalCompositeOperation='lighter';
 TORCH.forEach((q,i)=>{const px=q[0]*w,py=q[1]*h;flame(xb,px,py-s*.1,s,t,i*1.7);if(R()<dt*5*mult())embers.push({x:px,y:py-s,vx:(R()-.5)*14,vy:-(18+R()*30),l:0,m:1.2+R()*1.6,r:1+R()*1.6})});
 for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.l+=dt;e.x+=e.vx*dt+Math.sin(t*3+i)*.3;e.y+=e.vy*dt;if(e.l>e.m){embers.splice(i,1);continue}xb.globalAlpha=1-e.l/e.m;xb.fillStyle='#ffb347';xb.beginPath();xb.arc(e.x,e.y,e.r,0,6.283);xb.fill()}
 xb.globalCompositeOperation='source-over';xb.globalAlpha=1}
function frame(ms){const t=ms/1000,dt=Math.min(.05,t-last||.016);last=t;
 const w=modal.clientWidth,h=modal.clientHeight;if(!w){raf=requestAnimationFrame(frame);return}
 xb.clearRect(0,0,w,h);xf.clearRect(0,0,w,h);
 const card=modal.firstElementChild,r=card.getBoundingClientRect(),mr=modal.getBoundingClientRect();
 if(mode==='coins')coins(t,r.left-mr.left,r.top-mr.top,r.width);else torches(t,dt,w,h);
 raf=requestAnimationFrame(frame)}
function stop(){cancelAnimationFrame(raf);raf=0;embers=[];if(cb){xb.clearRect(0,0,cb.width,cb.height);xf.clearRect(0,0,cf.width,cf.height)}}
function start(){if(!cb){cb=mk(0);cf=mk(2);xb=cb.getContext('2d');xf=cf.getContext('2d')}fit();
 glints=[];const n=Math.round(24*mult());for(let i=0;i<n;i++)glints.push({u:.1+R()*.8,v:.5+R()*.45,p:R()*6.283,s:.8+R()*2.2,r:.012+R()*.02});
 last=0;raf=requestAnimationFrame(frame)}
function sync(){const card=modal.firstElementChild,sk=card&&card.dataset.skin,open=modal.classList.contains('open'),off=rt.contains('rm')||rt.contains('fx-off')||matchMedia('(prefers-reduced-motion: reduce)').matches;
 const m=open&&!off?(sk==='chest'?'coins':sk==='loot'?'torch':null):null;if(m===mode)return;mode=m;stop();if(m)start()}
new MutationObserver(sync).observe(modal,{attributes:true,subtree:true,attributeFilter:['class','data-skin']});
addEventListener('resize',()=>{if(mode)fit()});sync();
})();
</script>
